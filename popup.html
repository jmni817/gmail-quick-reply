<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>답변 버튼 관리</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f6f8fc;
      --border: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --accent: #1a73e8;
      --accent-soft: rgba(26, 115, 232, 0.1);
      --danger: #d93025;
      --ok: #188038;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --surface: #2a2b2f;
        --border: #3c4043;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #8ab4f8;
        --accent-soft: rgba(138, 180, 248, 0.14);
        --danger: #f28b82;
        --ok: #81c995;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 400px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 'Google Sans', Roboto, 'Malgun Gothic', sans-serif;
    }
    /* 옵션 페이지(새 탭)로 열렸을 때는 가운데 넓게 */
    @media (min-width: 600px) {
      body { width: auto; max-width: 640px; margin: 24px auto; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      #list { max-height: none; }
    }

    header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row label { color: var(--muted); white-space: nowrap; }
    select, input[type="text"], textarea {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      width: 100%;
    }
    select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; }

    #list {
      max-height: 400px;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
    }
    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-head { display: flex; gap: 6px; align-items: center; }
    .card-head input { font-weight: 600; }
    textarea { resize: vertical; min-height: 88px; line-height: 1.5; }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 5px 10px;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-soft); }
    button:disabled { opacity: 0.35; cursor: default; background: var(--bg); }
    .icon { width: 30px; padding: 5px 0; }
    .danger { color: var(--danger); }
    .danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    .primary:hover { background: var(--accent); filter: brightness(1.08); }
    @media (prefers-color-scheme: dark) { .primary { color: #202124; } }

    #empty { color: var(--muted); text-align: center; padding: 18px 0; }

    footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
    }
    #status { margin-left: auto; color: var(--muted); font-size: 12px; }
    #status.ok { color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <h1>Gmail 빠른 답변 버튼</h1>
    <div class="row">
      <label for="mode">삽입 방식</label>
      <select id="mode">
        <option value="cursor">커서 위치에 삽입 (커서가 없으면 본문 끝)</option>
        <option value="end">항상 본문 끝에 이어붙이기</option>
        <option value="replace">기존 본문 덮어쓰기</option>
      </select>
    </div>
    <p class="hint">서명과 인용된 이전 메일은 어떤 방식이든 그대로 유지됩니다.</p>
  </header>

  <main id="list" aria-label="답변 버튼 목록"></main>
  <p id="empty" hidden>버튼이 없습니다. 아래에서 추가해 보세요.</p>

  <footer>
    <button id="add" class="primary" type="button">+ 버튼 추가</button>
    <button id="reset" class="danger" type="button">기본값 복원</button>
    <span id="status" role="status"></span>
  </footer>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
